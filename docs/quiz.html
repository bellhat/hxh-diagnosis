<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HUNTER×HUNTER 念系統診断 - 質問</title>
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>

<body>
  <div class="aura-background"></div>

  <main class="container">
    <div class="question-counter">
      <span id="current-question">1</span> / <span id="total-questions">30</span>
    </div>

    <h1>質問</h1>
    <p id="question">ここに質問が表示されます</p>

    <div class="button-group">
      <button id="yesBtn" class="start-button">はい</button>
      <button id="noBtn" class="start-button">いいえ</button>
    </div>
  </main>

  <footer class="footer">
    <p>残りの質問に答えると、あなたの念の系統が明らかに…！</p>
  </footer>
</body>
</html>
